<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lauflängenkodierung</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #5c5c5c; --line: #c9c9c9;
    --panel: #f3f3f3; --accent: #1e66c2; --accent-fg: #ffffff;
    --px-w: #ffffff; --px-b: #1a1a1a; --px-line: #8a8a8a;
    --ok-bg: #d9f2dd; --ok-fg: #14531f; --err-bg: #fbd3d3; --err-fg: #7a1010;
    --hl-bg: #ffb3b3; --hl-fg: #7a1010;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --fg: #ececec; --muted: #a8a8a8; --line: #444;
      --panel: #2a2a2d; --accent: #5aa0f2; --accent-fg: #101010;
      --px-w: #f2f2f2; --px-b: #111111; --px-line: #777;
      --ok-bg: #1f4d28; --ok-fg: #c8f0cf; --err-bg: #5a1c1c; --err-fg: #ffd0d0;
      --hl-bg: #8a2a2a; --hl-fg: #ffe0e0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: none;
  }
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 10px; }
  .tabs button {
    background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px;
    padding: 6px 12px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .panel[hidden] { display: none; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  button.btn {
    font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); cursor: pointer;
  }
  button.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .grid {
    display: grid; grid-template-columns: repeat(6, 44px); gap: 2px;
    width: max-content; padding: 2px; background: var(--px-line); border-radius: 3px;
  }
  .cell { width: 44px; height: 44px; border: 0; padding: 0; cursor: pointer; background: var(--px-w); }
  .cell.on { background: var(--px-b); }
  .cell:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .codebox {
    margin-top: 10px; padding: 8px 10px; background: var(--panel); border-radius: 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 17px; line-height: 1.8;
  }
  .codebox .lbl { font-family: system-ui, sans-serif; font-size: 13px; color: var(--muted); margin-right: 6px; }
  .run { display: inline-block; padding: 0 5px; border-radius: 4px; }
  .run.bad { background: var(--hl-bg); color: var(--hl-fg); font-weight: 700; }
  .msg { padding: 6px 10px; border-radius: 6px; margin-top: 8px; display: none; }
  .msg.ok { display: block; background: var(--ok-bg); color: var(--ok-fg); }
  .msg.err { display: block; background: var(--err-bg); color: var(--err-fg); }
  .legend { font-size: 13px; color: var(--muted); }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(6, 34px); }
    .cell { width: 34px; height: 34px; }
  }
</style>
</head>
<body>
<div class="tabs" role="tablist">
  <button role="tab" id="tab-enc" aria-selected="true" aria-controls="enc">Kodieren</button>
  <button role="tab" id="tab-dec" aria-selected="false" aria-controls="dec">Dekodieren</button>
</div>

<!-- ===== Kodieren ===== -->
<section id="enc" class="panel" role="tabpanel" aria-labelledby="tab-enc">
  <div class="row">
    <span class="legend">Pixel anklicken: weiss ↔ schwarz</span>
    <button class="btn" id="enc-random">Zufallsbild</button>
  </div>
  <div class="grid" id="enc-grid" aria-label="Pixelfeld zum Kodieren"></div>
  <div class="codebox" id="enc-code" aria-live="polite"></div>
</section>

<!-- ===== Dekodieren ===== -->
<section id="dec" class="panel" role="tabpanel" aria-labelledby="tab-dec" hidden>
  <div class="codebox" id="dec-code" style="margin-top:0"></div>
  <div class="grid" id="dec-grid" aria-label="Pixelfeld zum Dekodieren" style="margin-top:10px"></div>
  <div class="row">
    <button class="btn" id="dec-new">Neue Aufgabe</button>
    <button class="btn primary" id="dec-check">Überprüfung</button>
  </div>
  <div class="msg" id="dec-msg" role="status"></div>
</section>

<script>
(function () {
  const W = 6;

  // ---------- Hilfsfunktionen ----------
  // Lauflängenkodierung über das ganze Feld (zeilenweise von links oben nach rechts unten).
  // Ergebnis: { start: 0|1, runs: [...] }
  function rle(flat) {
    const runs = []; let color = flat[0], n = 0;
    for (const p of flat) { if (p === color) n++; else { runs.push(n); color = p; n = 1; } }
    runs.push(n);
    return { start: flat[0], runs };
  }
  const name = c => c === 1 ? 'schwarz' : 'weiss';
  function randomField(rows) {
    // Läufe von 1 bis 5, so dass 4 bis 9 Läufe entstehen
    let flat;
    do {
      flat = []; let c = Math.random() < 0.5 ? 0 : 1;
      while (flat.length < rows * W) {
        const len = Math.min(rows * W - flat.length, 1 + Math.floor(Math.random() * 5));
        for (let i = 0; i < len; i++) flat.push(c);
        c = 1 - c;
      }
    } while (rle(flat).runs.length < 4 || rle(flat).runs.length > 9);
    return flat;
  }
  function makeGrid(el, rows, onToggle) {
    el.innerHTML = '';
    const cells = [];
    for (let i = 0; i < rows * W; i++) {
      const b = document.createElement('button');
      b.className = 'cell'; b.type = 'button';
      b.setAttribute('aria-label', 'Zeile ' + (Math.floor(i / W) + 1) + ', Spalte ' + (i % W + 1));
      b.addEventListener('click', () => { b.classList.toggle('on'); onToggle(); });
      el.appendChild(b); cells.push(b);
    }
    return cells;
  }
  const state = cells => cells.map(b => b.classList.contains('on') ? 1 : 0);
  function renderCode(el, code, bad) {
    el.innerHTML = '<span class="lbl">Startfarbe:</span>' + name(code.start) + '<br>'
      + '<span class="lbl">Lauflängen:</span>'
      + code.runs.map((n, j) => '<span class="run' + (bad && bad.includes(j) ? ' bad' : '') + '">' + n + '</span>').join('');
  }

  // ---------- Tabs ----------
  const tabs = [...document.querySelectorAll('[role=tab]')];
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(o => { o.setAttribute('aria-selected', o === t); document.getElementById(o.getAttribute('aria-controls')).hidden = o !== t; });
  }));

  // ---------- Kodieren ----------
  const ENC_ROWS = 3;
  const encCells = makeGrid(document.getElementById('enc-grid'), ENC_ROWS, renderEnc);
  document.getElementById('enc-random').addEventListener('click', () => {
    const f = randomField(ENC_ROWS); encCells.forEach((b, i) => b.classList.toggle('on', f[i] === 1)); renderEnc();
  });
  function renderEnc() { renderCode(document.getElementById('enc-code'), rle(state(encCells)), null); }
  renderEnc();

  // ---------- Dekodieren ----------
  const DEC_ROWS = 3;
  const decMsg = document.getElementById('dec-msg'), decCode = document.getElementById('dec-code');
  let target = [], code = null;
  const decCells = makeGrid(document.getElementById('dec-grid'), DEC_ROWS, () => {
    decMsg.className = 'msg'; renderCode(decCode, code, null);
  });
  document.getElementById('dec-new').addEventListener('click', newTask);
  document.getElementById('dec-check').addEventListener('click', check);

  function newTask() {
    target = randomField(DEC_ROWS); code = rle(target);
    decCells.forEach(b => b.classList.remove('on'));
    decMsg.className = 'msg'; renderCode(decCode, code, null);
  }
  function check() {
    const cur = state(decCells), bad = []; let pos = 0;
    code.runs.forEach((n, j) => {
      for (let i = pos; i < pos + n; i++) if (cur[i] !== target[i]) { bad.push(j); break; }
      pos += n;
    });
    renderCode(decCode, code, bad);
    if (bad.length === 0) {
      decMsg.className = 'msg ok'; decMsg.textContent = 'Richtig! Das Bild stimmt mit dem Code überein.';
    } else {
      decMsg.className = 'msg err';
      decMsg.textContent = 'Noch nicht ganz: ' + bad.length + (bad.length === 1 ? ' Lauflänge ist' : ' Lauflängen sind') + ' falsch umgesetzt (rot markiert).';
    }
  }
  newTask();
})();
</script>
</body>
</html>
